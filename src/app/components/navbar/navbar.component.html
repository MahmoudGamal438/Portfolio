<header class="nav" [class.is-compact]="compact()">
  <div class="container nav-inner">
    <a class="brand" routerLink="/" (click)="closeMenu()">
      <span class="mark" aria-hidden="true"
        ><img
          src="favicon.jpeg"
          alt="Logo"
          style="
            width: 100%;
            height: 100%;
            border-radius: 10px;
            overflow: hidden;
          "
      /></span>
      <span class="brand-text">
        <strong>{{ profile.name }}</strong>
        <small>Angular / Frontend</small>
      </span>
    </a>

    <nav
      class="links"
      [class.is-open]="open()"
      [attr.aria-expanded]="open()"
      aria-label="Primary"
    >
      @for (link of links; track link.id) {
        <button
          type="button"
          class="nav-link"
          [ngClass]="{ active: scroll.activeSection() === link.id }"
          (click)="goTo(link.id)"
        >
          {{ link.label }}
        </button>
      }
    </nav>

    <div class="actions">
      <button
        class="icon-btn"
        type="button"
        (click)="theme.toggle()"
        [attr.aria-label]="
          theme.theme() === 'dark'
            ? 'Switch to light mode'
            : 'Switch to dark mode'
        "
      >
        @if (theme.theme() === "dark") {
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <circle
              cx="12"
              cy="12"
              r="4.2"
              stroke="currentColor"
              stroke-width="1.8"
            />
            <path
              d="M12 3v2M12 19v2M4.2 12H2.2M21.8 12h-2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
        } @else {
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M16 13.5A6.5 6.5 0 0 1 10.5 4 7 7 0 1 0 20 13.5 6.4 6.4 0 0 1 16 13.5Z"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />
          </svg>
        }
      </button>
      <button
        class="menu"
        type="button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="open()"
        aria-label="Toggle navigation"
      >
        <span [class.open]="open()"></span>
      </button>
    </div>
  </div>
</header>
